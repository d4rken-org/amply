name: 'Common project setup'
description: 'Setup the base project'
runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5.2.0
      with:
        distribution: temurin
        # JDK 21 for the build/test toolchain — Robolectric requires Java 21 to emulate
        # Android SDK 36. Compiled bytecode still targets Java 17 (see app/build.gradle.kts).
        java-version: 21
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 #v4.0.1

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0
