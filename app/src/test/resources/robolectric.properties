# Robolectric otherwise instantiates the manifest's application — the real AmplyApp — once per test
# sandbox, and with it everything AmplyApp starts at process launch: the WSS auto-grant coordinator
# and, on the Play flavor, a live Google Play billing connection. That is right in production and
# wrong in a unit test: ~120 sandboxes in one JVM each stand up a Play client that is never torn
# down, which eventually exhausts the shared native runtime and fails unrelated Compose tests with
# an UnsatisfiedLinkError on RenderNode.
#
# No unit test needs the production Application. The one test that needs a Hilt graph
# (ChargeMonitorWatcherGraphTest) asks for HiltTestApplication explicitly via @Config.
application=android.app.Application
